<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PDF to EPUB</title>
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body class="auth-body">
    <main class="auth-shell">
      <section class="auth-panel">
        <p class="eyebrow">Local converter</p>
        <h1>PDF to EPUB</h1>
        {% if missing_config %}
          <p class="notice">Create a local PIN for this Mac.</p>
        {% endif %}
        {% if error %}
          <p class="error">{{ error }}</p>
        {% endif %}
        {% if missing_config %}
          <form method="post" action="/setup" class="pin-form">
            <label for="pin">PIN</label>
            <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="new-password" autofocus required>
            <label for="confirm-pin">Confirm PIN</label>
            <input id="confirm-pin" name="confirm_pin" type="password" inputmode="numeric" autocomplete="new-password" required>
            <button type="submit">Create PIN</button>
          </form>
        {% else %}
          <form method="post" action="/login" class="pin-form">
            <label for="pin">PIN</label>
            <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" autofocus required>
            <button type="submit">Unlock</button>
          </form>
        {% endif %}
      </section>
    </main>
  </body>
</html>
