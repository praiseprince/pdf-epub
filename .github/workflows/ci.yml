name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: pytest
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: mkdir -p tmp
      - run: npm run sample-epub -- tmp/sample.epub
      - run: curl -L -o tmp/epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
      - run: unzip -q tmp/epubcheck.zip -d tmp
      - run: EPUBCHECK_JAR=$PWD/tmp/epubcheck-5.3.0/epubcheck.jar npm run epubcheck -- tmp/sample.epub
      - run: npm run build
