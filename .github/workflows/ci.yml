name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: pytest
      - run: npm run node:check
      - run: node local_app/node/math_render.mjs < tests/fixtures/math-render-smoke.json
